name: 'ShipIT Forge'
description: 'Autonomous coding agent — fixes issues, opens PRs, and reviews PRs (with a security lens). Bring your own LLM key.'
author: 'Rahul Raj'
branding:
  icon: 'git-pull-request'
  color: 'orange'

inputs:
  provider:
    description: 'LLM provider: anthropic | openai | gemini | vertex | bedrock | groq | together | ollama | openai-compatible'
    required: false
    default: 'anthropic'
  model:
    description: 'Model id for the chosen provider. Falls back to that provider default.'
    required: false
  github-token:
    description: 'Token used to read the event, clone, and open PRs/reviews. Needs contents+PR+issues write.'
    required: false
    default: ${{ github.token }}

  # --- Dynamic behaviour: decide what this run does, per workflow -------------
  prompt:
    description: >-
      Extra instructions appended to the system prompt for this run. Encode your
      team standards here, or give a scheduled run its whole task.
    required: false
  allowed-tools:
    description: >-
      Comma/space separated tool allowlist, e.g. "read_file search glob". Only
      these are offered — a smaller toolset costs fewer tokens and improves tool
      choice. Empty means all tools for the flow.
    required: false
  disallowed-tools:
    description: 'Comma/space separated tools to remove, e.g. "run_bash".'
    required: false
  # --- Skills: named prompt packs, selectable or defined right here ----------
  skill:
    description: >-
      Run this skill for the workflow. Built-ins: code-review, fix-issue,
      pr-description, commit-summary, document, security-audit, triage. A skill
      committed under .forge/skills/<name>.md with the same name overrides it.
    required: false
  skill-name:
    description: 'Name for a skill defined inline below (default "workflow-skill").'
    required: false
  skill-description:
    description: 'One-line description for the inline skill.'
    required: false
  skill-prompt:
    description: >-
      Define a skill directly in this workflow — no committed file needed. The
      instructions here become the skill and take precedence over built-ins.
    required: false
  skill-tools:
    description: 'Tool allowlist for the inline skill, e.g. "read_file search glob".'
    required: false
  skills-path:
    description: 'Extra directory to load committed skills from (default .forge/skills).'
    required: false

  max-turns:
    description: 'Maximum agent iterations for this run (default 25).'
    required: false
  max-output-tokens:
    description: 'Output token budget per model turn (default 16384).'
    required: false
  trigger-phrase:
    description: 'Mention handle that addresses the agent (default "@shipit-forge").'
    required: false
  max-nits:
    description: 'Cap on low-severity inline review comments; -1 disables (default 5).'
    required: false
  prompt-cache:
    description: 'Set to "0" to disable prompt caching. On by default — caching cuts input cost substantially.'
    required: false
  thinking-budget:
    description: 'Extended-thinking token budget. 0 (default) disables it.'
    required: false
  # --- Security scanning: deterministic, no model call, no token cost --------
  secret-scan:
    description: >-
      Scan for committed credentials on every pull request. On by default. Set
      to "0" to turn it off. Costs nothing — there is no model call.
    required: false
  code-scan:
    description: >-
      Run the source-code security rules (injection, path traversal, clear-text
      logging, unsafe deserialization, workflow permissions) alongside the
      credential scan. On by default; set to "0" for secrets only.
    required: false
  external-scanners:
    description: >-
      Run the bundled third-party scanners (semgrep, gitleaks, trivy,
      osv-scanner, bandit, checkov) on /audit. On by default; set to "0" to
      turn them off. They never see the GitHub token or model keys.
    required: false
  audit-skills:
    description: >-
      Take /audit's specialist slices from another repository, pinned to a full
      commit SHA: owner/repo@<sha> (for example the shipiit/pentest-skills
      layout). Empty uses the built-in slices. The token must be able to read
      that repository.
    required: false
  review-depth:
    description: >-
      How thorough a pull-request review is. "light" is one pass, posted as
      found. "standard" (the default) is one pass, then a verifier that re-reads
      the code and drops findings it does not bear out. "deep" runs three
      reviewers with different focus (correctness, security, failure handling)
      and verifies what they find; it costs roughly three to four times a
      standard review.
    required: false
  dep-scan:
    description: >-
      Check lockfiles a pull request changes for known vulnerabilities and
      malicious releases (via OSV.dev), install scripts appearing in an update,
      and packages fetched from outside the registry. On by default; set to "0"
      to turn it off. No model call, but it does query api.osv.dev.
    required: false

  scan-block-on:
    description: >-
      Lowest severity that fails the scan's check run: critical | high |
      medium | low | info | none. Default "high". Set "low" to require every
      finding to be resolved or dismissed before the pull request can merge;
      "none" reports without ever blocking.
    required: false

  fallback-providers:
    description: 'Comma-separated providers to fall back to if the primary fails hard, e.g. "bedrock,openai".'
    required: false

  # --- Credentials -----------------------------------------------------------
  anthropic-api-key:
    description: 'Anthropic API key.'
    required: false
  openai-api-key:
    description: 'OpenAI API key.'
    required: false
  gemini-api-key:
    description: 'Gemini API key.'
    required: false
  vertex-credentials-json:
    description: 'Vertex AI service-account JSON (paste from a secret). Optional.'
    required: false
  app-id:
    description: 'GitHub App ID — if set (with private-key), Forge acts as your App bot. Optional.'
    required: false
  private-key:
    description: 'GitHub App private key (PEM). Optional; enables acting as the App.'
    required: false

runs:
  using: 'docker'
  image: 'Dockerfile.action'
