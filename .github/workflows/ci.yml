name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI reads the repository and runs tests. It writes nothing, and saying so is
# what stops a compromised dependency of any action here from doing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
