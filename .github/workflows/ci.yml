name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI reads the repository and runs tests. It writes nothing, and saying so is
# what stops a compromised dependency of any action here from doing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Does the review still find what it should, and stay quiet about what
      # it should not? The suite above proves the code runs; this proves the
      # findings are worth reading — the property that regresses silently when
      # a prompt is edited or a model is swapped for a cheaper one.
      - run: npm run build
      - run: node dist/cli.js eval --baseline evals/baseline.json
      - run: npm run build
